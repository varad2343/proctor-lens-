[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proctorlens"
version = "0.1.0"
description = "ML/CV pipeline: webcam video -> explainable observable events (no verdicts)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "opencv-python", "scipy", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
perception = ["mediapipe", "onnxruntime", "ultralytics", "insightface"]  # lazily imported by adapters
train = ["torch", "lightgbm"]
dev = ["pytest", "hypothesis", "ruff"]
web = ["fastapi", "uvicorn", "websockets", "httpx"]  # `proctorlens serve`; httpx = FastAPI's TestClient

[project.scripts]
proctorlens = "proctorlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
